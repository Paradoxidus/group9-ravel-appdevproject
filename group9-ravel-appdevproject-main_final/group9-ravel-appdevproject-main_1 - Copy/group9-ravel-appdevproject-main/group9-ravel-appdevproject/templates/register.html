<!DOCTYPE html>
<html>
<head>
    <title>Ravel - Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-container { width: 100%; max-width: 380px; }
        .logo-section { text-align: center; margin-bottom: 40px; }
        .logo-circle {
            width: 120px; height: 120px;
            background: linear-gradient(135deg, #1e3a8a 0%, #2e5c9a 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.3);
        }
        .music-note { font-size: 45px; color: white; margin-right: -5px; }
        .logo-text { font-size: 32px; font-weight: 700; color: white; letter-spacing: -0.5px; }

        .role-group { display: flex; gap: 10px; margin-bottom: 16px; }
        .role-option {
            flex: 1; border: 2px solid #d0d0d0; border-radius: 10px; padding: 12px;
            cursor: pointer; text-align: center; transition: border-color 0.2s, background 0.2s;
        }
        .role-option input { display: none; }
        .role-option.selected { border-color: #3b82f6; background: #eff6ff; }
        .role-option-title { font-size: 14px; font-weight: 600; color: #1a1a1a; }
        .role-option-sub  { font-size: 11px; color: #6b7280; margin-top: 2px; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 500; color: #1a1a1a; margin-bottom: 8px; }
        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%; padding: 14px 16px; border: 1px solid #d0d0d0;
            border-radius: 8px; background: #f5f5f5; color: #1a1a1a;
            font-size: 16px; transition: all 0.3s;
        }
        input::placeholder { color: #9ca3af; }
        input:focus {
            outline: none; border-color: #3b82f6; background: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .signup-btn {
            width: 100%; padding: 14px 16px; border: none; border-radius: 8px;
            background: #3b82f6; color: white; font-weight: 600; font-size: 16px;
            cursor: pointer; transition: background 0.3s, transform 0.2s; margin-top: 8px;
        }
        .signup-btn:hover { background: #2563eb; transform: translateY(-1px); }
        .signup-btn:active { transform: translateY(0); }

        .footer-text { text-align: center; font-size: 12px; color: #6b7280; margin-top: 24px; line-height: 1.5; }
        .footer-text a { color: #3b82f6; text-decoration: none; transition: color 0.2s; }
        .footer-text a:hover { color: #2563eb; text-decoration: underline; }
        .login-link { text-align: center; margin-top: 20px; font-size: 14px; color: #6b7280; }
        .login-link a { color: #3b82f6; font-weight: 600; text-decoration: none; transition: color 0.2s; }
        .login-link a:hover { color: #2563eb; }
        .alert-error {
            background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
            border-radius: 8px; padding: 12px 16px; font-size: 14px; margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo-section">
            <div class="logo-circle">
                <div>
                    <div class="music-note">♪</div>
                    <div class="logo-text">Ravel</div>
                </div>
            </div>
        </div>

        <form method="POST">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert-error">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <div class="role-group">
                <label class="role-option selected" id="role-listener" onclick="selectRole('Listener')">
                    <input type="radio" name="role" value="Listener" id="radio-listener" checked>
                    <div class="role-option-title">Listener</div>
                    <div class="role-option-sub">Discover music</div>
                </label>
                <label class="role-option" id="role-musician" onclick="selectRole('Musician')">
                    <input type="radio" name="role" value="Musician" id="radio-musician">
                    <div class="role-option-title">Musician</div>
                    <div class="role-option-sub">Upload tracks</div>
                </label>
            </div>

            <div class="form-group" id="artist-name-group" style="display: none;">
                <label class="form-label">Artist Name</label>
                <input type="text" name="artist_name" id="artist_name" placeholder="Your stage name">
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" required placeholder="Email">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" required placeholder="Password">
            </div>

            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <div class="footer-text">
            By clicking Sign Up, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </div>

        <div class="login-link">
            Already have an account? <a href="/login">Login</a>
        </div>
    </div>

<script>
function selectRole(role) {
    document.getElementById('role-listener').classList.toggle('selected', role === 'Listener');
    document.getElementById('role-musician').classList.toggle('selected', role === 'Musician');

    // Explicitly set the radio checked property due to custom label layout behavior
    document.getElementById('radio-listener').checked = (role === 'Listener');
    document.getElementById('radio-musician').checked = (role === 'Musician');

    var artistGroup = document.getElementById('artist-name-group');
    var artistInput = document.getElementById('artist_name');
    if (role === 'Musician') {
        artistGroup.style.display = 'block';
        artistInput.required = true;
    } else {
        artistGroup.style.display = 'none';
        artistInput.required = false;
    }
}
</script>
</body>
</html>
